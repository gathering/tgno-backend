name: build-image
on:
  push:
    branches:
      - 'main'

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  build-image:
    name: build image
    runs-on: ubuntu-latest
    needs: [ci]  # require tests to pass before build runs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to the Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build backend image for amd64
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        build-args: |
          APP_ENV=production
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/wagtail-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build nginx image for amd64
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        build-args: |
          APP_ENV=nginx-production
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/nginx-static:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max